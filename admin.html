<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendoShop 後台管理</title>
<style>body{background:#0b1020;color:#fff;font-family:sans-serif}table{width:100%;border-collapse:collapse}th,td{border:1px solid #555;padding:8px;text-align:left}</style>
</head>
<body>
<h2>商品管理</h2>
<table id="tblProducts"><thead><tr><th>ID</th><th>名稱</th><th>價格</th><th>庫存</th><th>操作</th></tr></thead><tbody></tbody></table>
<button onclick="addProduct()">新增商品</button>

<script>
const DB_KEY='vendoshop-db-v1';
function loadDB(){ const raw=localStorage.getItem(DB_KEY); return raw?JSON.parse(raw):{cats:[],products:[],orders:[]}; }
function saveDB(db){ localStorage.setItem(DB_KEY,JSON.stringify(db)); }
function renderTable(){ const db=loadDB(); const tbody=document.querySelector('#tblProducts tbody'); tbody.innerHTML=''; db.products.forEach(p=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${p.id}</td><td>${p.name}</td><td>${p.price}</td><td>${p.stock}</td><td><button onclick="editProduct('${p.id}')">編輯</button> <button onclick="delProduct('${p.id}')">刪除</button></td>`; tbody.appendChild(tr); }); }
function addProduct(){ const db=loadDB(); const id=prompt('ID'); const name=prompt('名稱'); const price=prompt('價格'); const stock=prompt('庫存'); db.products.push({id,name,price:Number(price),stock:Number(stock)}); saveDB(db); renderTable(); }
function editProduct(id){ const db=loadDB(); const p=db.products.find(x=>x.id===id); if(!p)return; p.name=prompt('名稱',p.name); p.price=Number(prompt('價格',p.price)); p.stock=Number(prompt('庫存',p.stock)); saveDB(db); renderTable(); }
function delProduct(id){ const db=loadDB(); db.products=db.products.filter(x=>x.id!==id); saveDB(db); renderTable(); }
renderTable();
</script>
</body>
</html>
