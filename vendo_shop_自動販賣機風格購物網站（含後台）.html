<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VendoShop｜自動販賣機風格購物網站</title>
  <meta name="description" content="自動販賣機風格的購物網站，含前台商店、購物車、訂單模擬與後台管理（產品/庫存/訂單），以 localStorage 儲存資料。" />
  <style>
    :root{
      --bg:#0b1020;         /* 背景 */
      --panel:#0e152e;      /* 面板 */
      --accent:#50d6ff;     /* 強調燈 */
      --accent-2:#5af5b6;   /* 第二強調 */
      --glass:#0b132b;      /* 玻璃 */
      --slot:#121a35;       /* 槽位 */
      --text:#e6f0ff;       /* 文字 */
      --muted:#9fb3c8;      /* 次要文字 */
      --danger:#ff7a7a;
      --ok:#6fe39a;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text); background: radial-gradient(1200px 800px at 20% -10%, #13204b 0%, #090e1c 60%, #05070e 100%);
    }

    a{color:inherit; text-decoration:none}
    button{cursor:pointer}

    /* 顶部欄 */
    .topbar{
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; gap:12px;
      padding:14px 18px; background:linear-gradient(180deg, rgba(8,12,25,.85), rgba(8,12,25,.45)); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .brand{ display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.5px }
    .brand .dot{width:10px;height:10px;border-radius:999px;background:var(--accent); box-shadow:0 0 18px var(--accent)}

    .seg{
      margin-left: auto; display:flex; align-items:center; gap:10px
    }
    .chip{
      background:#0e162f; border:1px solid rgba(255,255,255,.08); padding:8px 12px; border-radius:999px; color:var(--muted);
    }

    .search{ flex:1; max-width:520px; display:flex; align-items:center; gap:8px; background:#0b132a; border:1px solid rgba(255,255,255,.08);
      padding:8px 12px; border-radius:999px }
    .search input{
      outline:none; border:0; flex:1; background:transparent; color:var(--text);
    }

    .btn, .btn-ghost{
      border:1px solid rgba(255,255,255,.12); background:#111a39; color:var(--text); padding:9px 14px; border-radius:12px;
      display:inline-flex; align-items:center; gap:8px; box-shadow: var(--shadow);
    }
    .btn:hover{ filter:brightness(1.1)}
    .btn-ghost{ background:transparent; box-shadow:none }

    .layout{ display:grid; grid-template-columns: 300px 1fr; gap:16px; padding:18px; max-width:1280px; margin:0 auto }
    @media (max-width: 980px){ .layout{grid-template-columns:1fr} }

    /* 側邊分類欄 */
    .side{
      background: linear-gradient(180deg, #0f1a3d, #0b132b); border:1px solid rgba(255,255,255,.08);
      border-radius: var(--radius); padding:14px; position:sticky; top:74px; height:fit-content
    }
    .side h3{ margin:6px 0 10px; font-size:14px; color:var(--muted) }
    .cats{ display:grid; gap:8px }
    .cat{
      background: #0f1836; border:1px solid rgba(255,255,255,.08); padding:12px; border-radius:12px; display:flex; gap:10px; align-items:center; transition:.2s; cursor:pointer
    }
    .cat[data-active="true"]{ outline:2px solid var(--accent); background:#0b1632 }
    .cat .ic{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:18px; background:#0b132b; border:1px solid rgba(255,255,255,.08) }
    .meta{ font-size:12px; color:var(--muted) }

    /* 自動販賣機展示區 */
    .machine{
      background: linear-gradient(180deg, #0d1737, #0b1229); border:1px solid rgba(255,255,255,.1); border-radius:var(--radius);
      padding:16px; position:relative; overflow:hidden
    }
    .glass{
      border-radius:12px; background: linear-gradient(180deg, rgba(80,214,255,.06), rgba(90,245,182,.05)); border:1px solid rgba(255,255,255,.06);
      padding:14px; box-shadow: inset 0 0 40px rgba(80,214,255,.08), inset 0 0 100px rgba(90,245,182,.06);
    }

    .rack{ display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:14px }
    @media (max-width: 760px){ .rack{ grid-template-columns: repeat(2, 1fr) } }

    .slot{
      background: linear-gradient(160deg, #0b1228, #0a1122); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:10px; position:relative;
      min-height:160px; display:flex; flex-direction:column; gap:6px; justify-content:space-between; overflow:hidden
    }
    .slot:before{
      content:""; position:absolute; inset:0; background: radial-gradient(200px 120px at 80% -40%, rgba(80,214,255,.20), transparent 60%),
        radial-gradient(240px 180px at -40% 120%, rgba(90,245,182,.12), transparent 60%);
      opacity:.7; pointer-events:none
    }
    .slot-code{ position:absolute; top:8px; left:10px; font-weight:700; font-size:12px; letter-spacing:1px; color:var(--muted) }

    .pimg{ width:100%; aspect-ratio: 1.3/1; border-radius:12px; background:#0e183a; border:1px dashed rgba(255,255,255,.12); display:grid; place-items:center; font-size:38px }

    .pname{ font-size:14px; font-weight:700; line-height:1.2 }
    .price{ color:var(--accent-2); font-weight:800 }
    .stock{ font-size:12px; color:var(--muted) }

    .slot .row{ display:flex; align-items:center; justify-content:space-between; gap:8px }

    .add{ background: linear-gradient(180deg, #1a2e66, #15305e); border:1px solid rgba(80,214,255,.25); color:#d9f7ff; border-radius:10px; padding:8px 10px; font-weight:700 }
    .add[disabled]{ opacity:.5; cursor:not-allowed }

    .machine-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 2px 14px }
    .tabs{ display:flex; gap:8px; flex-wrap:wrap }
    .tab{ padding:8px 12px; background:#0d1736; border:1px solid rgba(255,255,255,.08); border-radius:999px; color:var(--muted); cursor:pointer }
    .tab[data-active="true"]{ color:var(--text); outline:2px solid var(--accent); background:#0a1532 }

    .hint{ font-size:12px; color:var(--muted) }

    /* 購物車抽屜 */
    .cart{
      position:fixed; right:16px; bottom:16px; width:min(420px, calc(100% - 32px));
      background: linear-gradient(180deg, #0f1a3d, #0b132b); border:1px solid rgba(255,255,255,.12); border-radius:18px; box-shadow: var(--shadow);
      padding:12px; z-index:60
    }
    .cart h4{ margin:4px 0 10px }
    .citems{ display:grid; gap:6px; max-height:280px; overflow:auto; padding-right:6px }
    .citem{ display:grid; grid-template-columns: auto 1fr auto; gap:8px; align-items:center; background:#0c1633; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px }
    .qty{ display:flex; align-items:center; gap:6px }
    .qty button{ width:28px; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,.12); background:#0a1530 }

    .cart .foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px; border-top:1px dashed rgba(255,255,255,.12) }

    /* 後台 */
    .admin{ display:none }
    .admin[data-show="true"]{ display:block }
    .panel{ background:#0e1839; border:1px solid rgba(255,255,255,.1); border-radius:16px; padding:14px; margin-top:12px }
    .grid{ display:grid; grid-template-columns: repeat(12, 1fr); gap:10px }
    .col-6{ grid-column: span 6 }
    .col-12{ grid-column: span 12 }
    @media (max-width: 880px){ .col-6{ grid-column: span 12 } }

    table{ width:100%; border-collapse: collapse }
    th, td{ text-align:left; font-size:14px; padding:10px; border-bottom:1px solid rgba(255,255,255,.08) }
    tbody tr:hover{ background:#0b1430 }
    input, select{ width:100%; background:#0b1430; border:1px solid rgba(255,255,255,.15); border-radius:10px; color:var(--text); padding:9px 10px }
    label{ font-size:12px; color:var(--muted) }
    .danger{ background:#3a0b14; border-color:#651b26; color:#ffb3b3 }
    .ok{ background:#08361f; border-color:#0d5f36; color:#b9ffd9 }

    .footer{ text-align:center; color:var(--muted); font-size:12px; padding:30px 10px }
  </style>
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand" aria-label="VendoShop">
      <span class="dot" aria-hidden="true"></span>
      <span>VendoShop</span>
      <span class="chip" title="Demo 模式">DEMO</span>
    </div>

    <div class="search" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.3-4.3" stroke="#8fb4ff" stroke-width="2" stroke-linecap="round"/><circle cx="10.5" cy="10.5" r="6.5" stroke="#8fb4ff" stroke-width="2"/></svg>
      <input id="q" placeholder="搜尋商品、槽位（A1、B2）、關鍵字…" />
    </div>

    <div class="seg">
      <button id="btnShop" class="btn" aria-pressed="true">🛒 商店</button>
      <button id="btnAdmin" class="btn-ghost">🧰 後台</button>
      <button id="btnExport" class="btn-ghost" title="匯出資料 JSON">📦 匯出</button>
      <label class="btn-ghost" style="position:relative; overflow:hidden">
        <input id="fileImport" type="file" accept="application/json" style="position:absolute;inset:0;opacity:0" />⬆️ 匯入
      </label>
    </div>
  </header>

  <main class="layout" role="main">
    <!-- 側邊分類 -->
    <aside class="side" aria-label="分類">
      <h3>分類 / Categories</h3>
      <div class="cats" id="catList"></div>
    </aside>

    <!-- 前台：自動販賣機區域 -->
    <section id="shop" class="machine" aria-label="自動販賣機展示區">
      <div class="machine-head">
        <div class="tabs" id="tabs"></div>
        <div class="hint">點擊槽位加入購物車。庫存歸零會顯示售罄。</div>
      </div>
      <div class="glass">
        <div id="rack" class="rack" aria-live="polite"></div>
      </div>
    </section>

    <!-- 後台：管理 -->
    <section id="admin" class="admin">
      <div class="panel">
        <div class="grid">
          <div class="col-6">
            <h3>➕ 新增 / 編輯商品</h3>
            <div class="grid">
              <div class="col-12">
                <label>商品 ID（留空為新增）</label>
                <input id="f-id" placeholder="自動產生" />
              </div>
              <div class="col-6">
                <label>名稱</label>
                <input id="f-name" placeholder="例如：氣泡水" />
              </div>
              <div class="col-3">
                <label>價格（NT$）</label>
                <input id="f-price" type="number" placeholder="45" />
              </div>
              <div class="col-3">
                <label>庫存</label>
                <input id="f-stock" type="number" placeholder="10" />
              </div>
              <div class="col-6">
                <label>分類</label>
                <select id="f-cat"></select>
              </div>
              <div class="col-6">
                <label>槽位代碼（如 A1、B2）</label>
                <input id="f-slot" placeholder="A1" />
              </div>
              <div class="col-12">
                <label>圖片（留空使用內建 SVG）</label>
                <input id="f-img" placeholder="https://... 或 data:image/svg+xml;base64,..." />
              </div>
              <div class="col-12" style="display:flex; gap:8px; flex-wrap:wrap">
                <button id="btnSave" class="btn ok">💾 儲存</button>
                <button id="btnDelete" class="btn danger">🗑 刪除</button>
                <button id="btnClear" class="btn-ghost">🧹 清空表單</button>
              </div>
            </div>
          </div>

          <div class="col-6">
            <h3>📦 商品列表</h3>
            <div style="overflow:auto; max-height:420px; border:1px solid rgba(255,255,255,.08); border-radius:12px">
              <table id="tblProducts" aria-label="商品列表">
                <thead>
                  <tr><th>ID</th><th>名稱</th><th>分類</th><th>槽位</th><th>價格</th><th>庫存</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="col-12">
            <h3>🧾 訂單（僅示範）</h3>
            <div class="panel">
              <table id="tblOrders">
                <thead>
                  <tr><th>#</th><th>時間</th><th>項目</th><th>總額</th><th>付款方式</th></tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 購物車抽屜 -->
  <aside class="cart" aria-label="購物車" id="cart">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px">
      <h4>🛍 購物車</h4>
      <div class="hint" id="cartCount">0 件</div>
    </div>
    <div class="citems" id="cartItems"></div>
    <div class="foot">
      <div>
        <div class="hint">小計</div>
        <div id="cartTotal" style="font-size:20px; font-weight:800">NT$ 0</div>
      </div>
      <div style="display:flex; gap:8px">
        <button id="btnClearCart" class="btn-ghost">清空</button>
        <button id="btnCheckout" class="btn">結帳</button>
      </div>
    </div>
  </aside>

  <footer class="footer">© <span id="year"></span> VendoShop — 自動販賣機風格 Demo。資料以瀏覽器 localStorage 儲存，可離線試用與匯出/匯入。</footer>

  <script>
  // ====== 資料層（localStorage） ======
  const DB = {
    key: 'vendoshop-db-v1',
    load(){
      const raw = localStorage.getItem(this.key);
      if(!raw){
        const seed = seedData();
        localStorage.setItem(this.key, JSON.stringify(seed));
        return seed;
      }
      try{ return JSON.parse(raw) }catch{ const seed = seedData(); localStorage.setItem(this.key, JSON.stringify(seed)); return seed }
    },
    save(data){ localStorage.setItem(this.key, JSON.stringify(data)) }
  }

  function seedData(){
    const cats = [
      { id:'drinks', name:'Drinks 飲品', icon:'🥤' },
      { id:'snacks', name:'Snacks 零食', icon:'🍫' },
      { id:'gadgets', name:'Gadgets 小物', icon:'⚙️' },
      { id:'home',   name:'Home 居家',   icon:'🏠' },
    ];
    const products = [
      p('氣泡水', 45, 'drinks', 'A1', 10, '🥤'),
      p('冷萃咖啡', 65, 'drinks', 'A2', 8, '☕'),
      p('運動飲料', 55, 'drinks', 'A3', 9, '🧃'),
      p('綠茶', 40, 'drinks', 'A4', 12, '🍵'),

      p('洋芋片', 35, 'snacks', 'B1', 15, '🍟'),
      p('巧克力棒', 30, 'snacks', 'B2', 14, '🍫'),
      p('堅果包', 50, 'snacks', 'B3', 10, '🥜'),
      p('餅乾', 28, 'snacks', 'B4', 20, '🍪'),

      p('Type-C 線', 120, 'gadgets', 'C1', 7, '🔌'),
      p('行動電源', 650, 'gadgets', 'C2', 5, '🔋'),
      p('藍牙耳機', 990, 'gadgets', 'C3', 3, '🎧'),
      p('手機支架', 150, 'gadgets', 'C4', 9, '📱'),

      p('護手霜', 120, 'home', 'D1', 11, '🧴'),
      p('香氛蠟燭', 280, 'home', 'D2', 6, '🕯️'),
      p('濕紙巾', 45, 'home', 'D3', 16, '🧻'),
      p('清潔布', 60, 'home', 'D4', 10, '🧼'),
    ];
    return { cats, products, orders: [] };

    function p(name, price, cat, slot, stock, emoji){
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : (Date.now()+Math.random()).toString(36),
        name, price, cat, slot, stock,
        img: buildSVG(emoji, name)
      }
    }
  }

  function buildSVG(emoji, label){
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='512' height='384'>
      <defs>
        <linearGradient id='g' x1='0' x2='0' y1='0' y2='1'>
          <stop offset='0%' stop-color='#14234f'/>
          <stop offset='100%' stop-color='#0c1739'/>
        </linearGradient>
      </defs>
      <rect width='100%' height='100%' rx='28' fill='url(#g)'/>
      <circle cx='420' cy='-20' r='180' fill='rgba(80,214,255,0.25)'/>
      <text x='50%' y='48%' dominant-baseline='middle' text-anchor='middle' font-size='140'>${emoji}</text>
      <text x='50%' y='76%' dominant-baseline='middle' text-anchor='middle' fill='#b8d4ff' font-family='sans-serif' font-size='28'>${label}</text>
    </svg>`;
    return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }

  let state = DB.load();

  // ====== UI 綁定 ======
  const el = s => document.querySelector(s);
  const els = s => Array.from(document.querySelectorAll(s));

  const rack = el('#rack');
  const tabs = el('#tabs');
  const q = el('#q');
  const catList = el('#catList');

  const btnShop = el('#btnShop');
  const btnAdmin = el('#btnAdmin');
  const btnExport = el('#btnExport');
  const fileImport = el('#fileImport');

  const viewShop = el('#shop');
  const viewAdmin = el('#admin');

  const fId = el('#f-id');
  const fName = el('#f-name');
  const fPrice = el('#f-price');
  const fStock = el('#f-stock');
  const fCat = el('#f-cat');
  const fSlot = el('#f-slot');
  const fImg = el('#f-img');

  const tblProducts = el('#tblProducts tbody');
  const tblOrders = el('#tblOrders tbody');

  const cartList = el('#cartItems');
  const cartTotal = el('#cartTotal');
  const cartCount = el('#cartCount');
  const btnCheckout = el('#btnCheckout');
  const btnClearCart = el('#btnClearCart');

  const YEAR = el('#year'); YEAR.textContent = new Date().getFullYear();

  let currentCat = state.cats[0]?.id || 'drinks';
  let cart = [];

  // ====== 初始化分類 ======
  function renderCats(){
    // 側欄
    catList.innerHTML = state.cats.map(c => `
      <div class="cat" data-id="${c.id}" data-active="${c.id===currentCat}">
        <div class="ic">${c.icon}</div>
        <div>
          <div>${c.name}</div>
          <div class="meta">ID: ${c.id}</div>
        </div>
      </div>
    `).join('');
    catList.querySelectorAll('.cat').forEach(x=>x.onclick = ()=>{ currentCat = x.dataset.id; renderTabs(); renderRack(); renderCats() })

    // 上方 tabs
    renderTabs();
  }

  function renderTabs(){
    tabs.innerHTML = state.cats.map(c => `
      <button class="tab" data-active="${c.id===currentCat}" data-id="${c.id}">${c.icon} ${c.name}</button>
    `).join('');
    tabs.querySelectorAll('.tab').forEach(b => b.onclick = ()=> { currentCat = b.dataset.id; renderTabs(); renderRack() })

    // 後台分類下拉
    fCat.innerHTML = state.cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }

  // ====== 展示商品 ======
  function renderRack(){
    const keyword = q.value.trim().toLowerCase();
    let items = state.products.filter(p => p.cat===currentCat);
    if(keyword){
      items = state.products.filter(p =>
        p.name.toLowerCase().includes(keyword) ||
        p.slot.toLowerCase().includes(keyword) ||
        p.cat.toLowerCase().includes(keyword)
      );
    }
    rack.innerHTML = items.map(p => slotHTML(p)).join('');
    rack.querySelectorAll('.add').forEach(btn => btn.onclick = ()=> addToCart(btn.dataset.id));
  }

  function slotHTML(p){
    const soldout = p.stock<=0;
    return `
      <div class="slot" aria-label="商品 ${p.name}">
        <div class="slot-code">${p.slot}</div>
        <div class="pimg">${p.img?`<img src="${p.img}" alt="${p.name}" style="max-width:100%; max-height:100%; border-radius:10px"/>`:'❓'}</div>
        <div class="row">
          <div>
            <div class="pname">${p.name}</div>
            <div class="stock">${soldout?'<span style="color:var(--danger);font-weight:700">售罄</span>':`庫存 ${p.stock}`}</div>
          </div>
          <div style="text-align:right">
            <div class="price">NT$ ${p.price}</div>
            <button class="add" ${soldout?'disabled':''} data-id="${p.id}">購入</button>
          </div>
        </div>
      </div>`
  }

  // ====== 購物車 ======
  function addToCart(pid){
    const p = state.products.find(x=>x.id===pid);
    if(!p || p.stock<=0) return;
    const exist = cart.find(x=>x.id===pid);
    if(exist){ exist.qty++; } else { cart.push({ id:pid, qty:1 }); }
    p.stock--; DB.save(state);
    renderRack(); renderCart(); renderProductsTable();
  }

  function renderCart(){
    if(cart.length===0){ cartList.innerHTML = '<div class="hint">購物車是空的</div>'; cartTotal.textContent='NT$ 0'; cartCount.textContent='0 件'; return }
    cartList.innerHTML = cart.map(ci => {
      const p = state.products.find(x=>x.id===ci.id);
      return `<div class="citem">
        <div class="ic" style="width:36px; height:36px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.12); border-radius:8px; background:#0a1530">${p ? `<img src='${p.img}' alt='' style='width:100%;height:100%;object-fit:cover;border-radius:6px'/>` : '🧺'}</div>
        <div>
          <div style="font-weight:700">${p?.name || '未知商品'}</div>
          <div class="hint">${p?.slot || ''}</div>
        </div>
        <div class="qty">
          <button aria-label="減少" onclick="changeQty('${ci.id}',-1)">−</button>
          <div aria-live="polite">${ci.qty}</div>
          <button aria-label="增加" onclick="changeQty('${ci.id}',1)">＋</button>
        </div>
      </div>`
    }).join('');
    const total = cart.reduce((sum,ci)=>{
      const p = state.products.find(x=>x.id===ci.id); return sum + (p?p.price:0) * ci.qty;
    },0);
    cartTotal.textContent = 'NT$ ' + total.toLocaleString();
    cartCount.textContent = cart.reduce((s,x)=>s+x.qty,0) + ' 件';
  }
  window.changeQty = function(pid,delta){
    const idx = cart.findIndex(x=>x.id===pid);
    if(idx<0) return;
    const p = state.products.find(x=>x.id===pid);
    cart[idx].qty += delta;
    if(cart[idx].qty<=0){ cart.splice(idx,1); }
    if(delta<0){ p.stock++; } // 退回庫存
    if(delta>0){ if(p.stock>0) { p.stock--; } else { cart[idx].qty-=1; alert('庫存不足'); } }
    DB.save(state); renderCart(); renderRack(); renderProductsTable();
  }

  btnClearCart.onclick = ()=>{ if(confirm('清空購物車？')){ // 歸還庫存
    cart.forEach(ci=>{ const p = state.products.find(x=>x.id===ci.id); if(p) p.stock += ci.qty; }); cart=[]; DB.save(state); renderCart(); renderRack(); renderProductsTable(); }}

  btnCheckout.onclick = ()=>{
    if(cart.length===0) return alert('購物車為空');
    const payment = prompt('選擇付款方式：cash / card / mobile', 'mobile') || 'cash';
    const items = cart.map(ci=>{ const p = state.products.find(x=>x.id===ci.id); return { id:ci.id, name:p?.name||'', price:p?.price||0, qty:ci.qty } });
    const total = items.reduce((s,i)=>s+i.price*i.qty,0);
    state.orders.unshift({ id: 'O'+Date.now(), time: new Date().toLocaleString(), items, total, payment });
    cart = []; DB.save(state); renderCart(); renderOrdersTable(); alert('感謝購買！訂單已建立。')
  }

  // ====== 後台：產品 CRUD ======
  function fillForm(p){
    fId.value = p?.id || '';
    fName.value = p?.name || '';
    fPrice.value = p?.price ?? '';
    fStock.value = p?.stock ?? '';
    fCat.value = p?.cat || state.cats[0]?.id || 'drinks';
    fSlot.value = p?.slot || '';
    fImg.value = p?.img && !p.img.startsWith('data:image/svg+xml') ? p.img : '';
  }

  el('#btnClear').onclick = ()=> fillForm(null);

  el('#btnSave').onclick = ()=>{
    const id = fId.value || (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+Math.random()).toString(36));
    const exists = state.products.find(x=>x.id===id);
    const data = {
      id,
      name: fName.value.trim() || '未命名商品',
      price: Math.max(0, Number(fPrice.value||0)),
      stock: Math.max(0, Number(fStock.value||0)),
      cat: fCat.value,
      slot: (fSlot.value||'').toUpperCase().replace(/\s+/g,''),
      img: fImg.value.trim() || buildSVG('🧺', fName.value.trim()||'商品')
    };
    if(exists){ Object.assign(exists, data); }
    else { state.products.push(data); }
    DB.save(state); renderProductsTable(); renderRack(); alert('已儲存');
  }

  el('#btnDelete').onclick = ()=>{
    const id = fId.value; if(!id) return alert('請先輸入/選擇要刪除的商品');
    if(!confirm('確定刪除商品？')) return;
    const i = state.products.findIndex(x=>x.id===id);
    if(i>=0){ state.products.splice(i,1); DB.save(state); renderProductsTable(); renderRack(); fillForm(null); alert('已刪除'); }
  }

  function renderProductsTable(){
    const rows = state.products
      .slice().sort((a,b)=>a.slot.localeCompare(b.slot))
      .map(p => `<tr data-id='${p.id}' style='cursor:pointer'>
        <td>${p.id.slice(0,6)}…</td><td>${p.name}</td><td>${p.cat}</td><td>${p.slot}</td><td>NT$ ${p.price}</td><td>${p.stock}</td>
      </tr>`).join('');
    tblProducts.innerHTML = rows || '<tr><td colspan="6" class="hint">尚無商品</td></tr>';
    tblProducts.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = ()=>{
      const p = state.products.find(x=>x.id===tr.dataset.id); fillForm(p);
      window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' })
    })
  }

  function renderOrdersTable(){
    tblOrders.innerHTML = state.orders.map((o,i)=>{
      const names = o.items.map(x=>`${x.name}×${x.qty}`).join('、');
      return `<tr><td>${o.id}</td><td>${o.time}</td><td>${names}</td><td>NT$ ${o.total}</td><td>${o.payment}</td></tr>`
    }).join('') || '<tr><td colspan="5" class="hint">尚無訂單</td></tr>';
  }

  // ====== 匯出 / 匯入 ======
  btnExport.onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'vendoshop-data.json'; a.click(); URL.revokeObjectURL(url);
  }
  fileImport.onchange = async (e)=>{
    const file = e.target.files?.[0]; if(!file) return;
    const text = await file.text();
    try{ const data = JSON.parse(text); if(!data.products||!data.cats) throw 0; state = data; DB.save(state); init(); alert('匯入完成'); }
    catch{ alert('格式不正確'); }
  }

  // ====== 前台/後台 切換 ======
  btnShop.onclick = ()=> showView('shop');
  btnAdmin.onclick = ()=>{
    // 極簡認證：第一次進入要求密碼（預設 1234）
    if(!sessionStorage.getItem('vendoshop-admin-ok')){
      const pass = prompt('輸入管理密碼（預設：1234）','1234');
      if(pass!=='1234') return alert('密碼錯誤');
      sessionStorage.setItem('vendoshop-admin-ok','1');
    }
    showView('admin');
  }
  function showView(which){
    const isAdmin = which==='admin';
    viewAdmin.setAttribute('data-show', isAdmin);
    viewShop.style.display = isAdmin? 'none':'block';
    btnAdmin.className = isAdmin? 'btn':'btn-ghost';
    btnShop.className = isAdmin? 'btn-ghost':'btn';
  }

  // ====== 搜尋 ======
  q.addEventListener('input', ()=> renderRack());

  // ====== 啟動 ======
  function init(){
    renderCats();
    renderRack();
    renderProductsTable();
    renderOrdersTable();
    renderCart();
  }
  init();

  </script>
</body>
</html>
