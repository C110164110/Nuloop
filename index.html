<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendoShop｜自動販賣機購物網站</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#0b1020;--panel:#0e152e;--accent:#50d6ff;--text:#e6f0ff;--shadow:0 10px 30px rgba(0,0,0,.35);--radius:16px;}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial;color:var(--text);background:radial-gradient(1200px 800px at 20% -10%,#13204b 0%,#090e1c 60%,#05070e 100%)}
a{color:inherit;text-decoration:none}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(180deg,rgba(8,12,25,.85),rgba(8,12,25,.45));backdrop-filter: blur(8px);border-bottom: 1px solid rgba(255,255,255,.06);}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.brand .dot{width:10px;height:10px;border-radius:999px;background:var(--accent);box-shadow:0 0 18px var(--accent)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:#0b132a;border:1px solid rgba(255,255,255,.08);padding:8px 12px;border-radius:999px}
.search input{outline:none;border:0;flex:1;background:transparent;color:var(--text)}
.btn,.btn-ghost{border:1px solid rgba(255,255,255,.12);background:#111a39;color:var(--text);padding:9px 14px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;box-shadow: var(--shadow);}
.btn:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;box-shadow:none}
.layout{display:flex;gap:12px;padding:12px}
.machine{flex:3;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.slot{background:var(--panel);padding:12px;border-radius:var(--radius);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;box-shadow:var(--shadow)}
.cart{flex:1;background:var(--panel);padding:12px;border-radius:var(--radius);display:flex;flex-direction:column;gap:8px}
.footer{text-align:center;padding:12px;margin-top:12px;color:var(--text)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>VendoShop</div>
  <div class="search"><input id="q" placeholder="搜尋商品…"></div>
  <div class="seg">
    <button id="btnLogin" class="btn">登入 / 註冊</button>
    <button id="btnLogout" class="btn-ghost" style="display:none">登出</button>
    <button id="btnFav" class="btn-ghost">❤️ 我的收藏</button>
  </div>
</header>

<main class="layout">
  <section id="shop" class="machine">
    <div id="rack" class="rack"></div>
  </section>
  <aside class="cart" id="cart">
    <h4>購物車</h4>
    <div id="cartItems"></div>
    <div id="cartTotal">NT$ 0</div>
    <button id="btnCheckout" class="btn">結帳</button>
  </aside>
</main>

<footer class="footer">© <span id="year"></span> VendoShop</footer>

<script>
// ====== Firebase ======
const firebaseConfig = {
  apiKey: "AIzaSyC-1c7MOx-tZ7ftvTBH1pZor_or3JofEIk",
  authDomain: "nuloop-fb031.firebaseapp.com",
  projectId: "nuloop-fb031",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ====== localStorage 產品資料 ======
const DB = {
  key:'vendoshop-db-v1',
  load(){const raw=localStorage.getItem(this.key); if(!raw){const seed=seedData(); localStorage.setItem(this.key, JSON.stringify(seed)); return seed;} try{return JSON.parse(raw);}catch{return seedData();}},
  save(data){localStorage.setItem(this.key, JSON.stringify(data));}
}
function seedData(){ 
  const cats = [{id:'drinks',name:'飲品',icon:'🥤'},{id:'snacks',name:'零食',icon:'🍫'}]; 
  const products = [
    {id:'A1',name:'氣泡水',price:45,cat:'drinks',stock:10,img:''}, 
    {id:'B1',name:'洋芋片',price:35,cat:'snacks',stock:15,img:''}
  ]; 
  return {cats,products,orders:[]}; 
}
let state = DB.load();
let cart=[]; 
let currentUser=null;

// ====== UI ======
const rack = document.getElementById('rack');
const cartItems = document.getElementById('cartItems');
const cartTotal = document.getElementById('cartTotal');
const q = document.getElementById('q');
const btnLogin = document.getElementById('btnLogin');
const btnLogout = document.getElementById('btnLogout');
const btnFav = document.getElementById('btnFav');
const YEAR = document.getElementById('year');
YEAR.textContent = new Date().getFullYear();

// ====== render 商品 ======
function renderRack(){
  const keyword = q.value.trim().toLowerCase();
  const items = state.products.filter(p=>!keyword||p.name.toLowerCase().includes(keyword));
  rack.innerHTML = items.map(p=>`<div class="slot">
  <div>${p.name}</div>
  <div>NT$ ${p.price}</div>
  <div>庫存: ${p.stock}</div>
  <button ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')">加入</button>
  </div>`).join('');
}

// ====== 購物車 ======
function addToCart(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p || p.stock<=0) return;
  const exist = cart.find(x=>x.id===pid);
  if(exist){ exist.qty++; } else { cart.push({id:pid,qty:1}); }
  p.stock--;
  DB.save(state); renderRack(); renderCart();
}
function renderCart(){
  if(cart.length===0){ cartItems.innerHTML='<div>購物車空</div>'; cartTotal.textContent='NT$ 0'; return;}
  cartItems.innerHTML = cart.map(ci=>{
    const p=state.products.find(x=>x.id===ci.id);
    return `<div>${p.name} x${ci.qty}</div>`;
  }).join('');
  const total = cart.reduce((sum,ci)=>{ const p=state.products.find(x=>x.id===ci.id); return sum+(p?p.price:0)*ci.qty; },0);
  cartTotal.textContent='NT$ '+total;
}

// ====== Firebase Auth ======
btnLogin.onclick = async ()=>{
  const email = prompt('Email');
  const pass = prompt('密碼');
  try{
    currentUser = await auth.signInWithEmailAndPassword(email,pass);
    alert('登入成功'); btnLogin.style.display='none'; btnLogout.style.display='inline-block'; loadUserData();
  }catch(e){
    if(e.code==='auth/user-not-found'){
      try{currentUser = await auth.createUserWithEmailAndPassword(email,pass); alert('註冊成功'); btnLogin.style.display='none'; btnLogout.style.display='inline-block'; loadUserData(); }catch(e2){alert(e2.message);}
    }else{alert(e.message);}
  }
}
btnLogout.onclick = async ()=>{await auth.signOut(); currentUser=null; btnLogin.style.display='inline-block'; btnLogout.style.display='none'; alert('已登出');}

// ====== 追蹤喜歡 ======
btnFav.onclick = async ()=>{
  if(!currentUser){ alert('請先登入'); return; }
  const likes = await db.collection('users').doc(currentUser.user.uid).collection('likes').get();
  alert('你喜歡的商品: '+likes.docs.map(d=>d.id).join(', '));
}

// ====== 結帳（藍新金流示範） ======
async function checkout(){
  if(cart.length===0){ alert('購物車空'); return; }
  if(!currentUser){ alert('請先登入'); return; }
  const total = cart.reduce((sum,ci)=>{ const p=state.products.find(x=>x.id===ci.id); return sum+(p?p.price:0)*ci.qty; },0);
  const order = { items:cart, total, time:new Date().toISOString() };
  // 儲存訂單
  await db.collection('users').doc(currentUser.user.uid).collection('orders').add(order);
  // === 這裡串藍新金流 API ===
  // 示範：直接跳 alert
  alert(`訂單已送出，總金額 NT$ ${total}，可串藍新金流付款`);
  cart=[]; renderCart(); renderRack();
}
document.getElementById('btnCheckout').onclick = checkout;

// ====== 載入使用者資料 ======
async function loadUserData(){
  if(!currentUser) return;
  const orders = await db.collection('users').doc(currentUser.user.uid).collection('orders').get();
  console.log('歷史訂單', orders.docs.map(d=>d.data()));
}

q.addEventListener('input',()=>renderRack());
renderRack();
</script>
</body>
</html>
